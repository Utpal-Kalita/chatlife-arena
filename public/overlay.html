<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatLife Arena</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:rgba(7,11,19,.82);color:#f5f7ff;font:650 clamp(12px,1vw,19px)/1.2 system-ui,sans-serif;display:flex;flex-direction:column;padding:2vh 2vw;gap:1.4vh}.top{display:flex;align-items:center;gap:1.5vw;min-height:48px}.brand{font-weight:950;font-size:1.3em;letter-spacing:.08em}.gen{color:#acb9ce}.counts{display:flex;gap:1em;font-weight:900}.fire{color:#ff704d}.ice{color:#53cfff}.bar{height:12px;flex:1;display:flex;border-radius:99px;overflow:hidden;background:#ffffff12;box-shadow:0 0 15px #0005}.bar span{transition:width .45s}.firebar{background:linear-gradient(90deg,#ff4e38,#ff9b45)}.icebar{background:linear-gradient(90deg,#168dff,#62e8ff)}.pct{font-size:.8em;color:#aeb9cc;min-width:105px;text-align:right}.board{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(48,1fr);grid-template-rows:repeat(27,1fr);gap:2px;padding:2px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);border-radius:10px;box-shadow:0 16px 60px #0005}.cell{position:relative;background:rgba(255,255,255,.025);border-radius:2px}.cell.fire{background:#ff6045;box-shadow:inset 0 0 0 1px #ffffff25,0 0 7px #f63a4c66}.cell.ice{background:#36baff;box-shadow:inset 0 0 0 1px #ffffff35,0 0 7px #25b7ff66}.cell.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}.cell.pop:after{content:attr(data-user);position:absolute;z-index:2;left:50%;top:-24px;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:white;text-shadow:0 2px 5px #000;animation:fade 2.5s forwards;pointer-events:none}.footer{display:flex;align-items:center;gap:1.4em;min-height:25px;font-size:.82em;color:#aeb9cc}.painters{display:flex;gap:.5em}.painters span{background:#ffffff12;border:1px solid #ffffff18;padding:.3em .65em;border-radius:99px}.banner{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:#050913bb;border-radius:9px;font-size:clamp(32px,7vw,100px);font-weight:1000;letter-spacing:.06em;text-shadow:0 4px 35px currentColor}.banner.show{display:grid}.banner.fire{color:#ff754c}.banner.ice{color:#54d5ff}.banner.draw{color:#eee}@keyframes pop{0%{transform:scale(.25);filter:brightness(2)}75%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}
</style></head><body><header class="top"><span class="brand">CHATLIFE ARENA</span><span id="gen" class="gen">GEN 0</span><div class="counts"><span class="fire">FIRE <b id="fire">0</b></span><span class="ice">ICE <b id="ice">0</b></span></div><div class="bar"><span id="firebar" class="firebar"></span><span id="icebar" class="icebar"></span></div><span id="pct" class="pct">FIRE 0% · ICE 0%</span></header><div id="board" class="board"><div id="banner" class="banner"></div></div><footer class="footer"><b>LAST PAINTERS</b><div id="painters" class="painters"></div><span>!join fire / !join ice · !paint x y · !score</span></footer>
<script>
const board=document.querySelector('#board'),banner=document.querySelector('#banner'),cells=[];for(let y=1;y<=27;y++)for(let x=1;x<=48;x++){const el=document.createElement('div');el.className='cell';cells.push(el);board.insertBefore(el,banner)}
function updateStats(s){const t=s.territory;document.querySelector('#gen').textContent=`GEN ${s.generation}`;document.querySelector('#fire').textContent=t.fire;document.querySelector('#ice').textContent=t.ice;document.querySelector('#firebar').style.width=`${t.firePct}%`;document.querySelector('#icebar').style.width=`${t.icePct}%`;document.querySelector('#pct').textContent=`FIRE ${t.firePct}% · ICE ${t.icePct}%`;document.querySelector('#painters').replaceChildren(...(s.latest||[]).map(n=>{const el=document.createElement('span');el.textContent=n;return el}))}
function setCell(p,pop=false){const el=cells[(p.y-1)*48+p.x-1];el.classList.remove('fire','ice','pop');if(p.team)el.classList.add(p.team);if(pop&&p.team){el.dataset.user=p.user||'';void el.offsetWidth;el.classList.add('pop')}}
function showRound(round){banner.className='banner';if(round){banner.textContent=round.banner;banner.classList.add('show',round.banner.startsWith('FIRE')?'fire':round.banner.startsWith('ICE')?'ice':'draw')}else banner.textContent=''}
function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='snapshot'){cells.forEach(el=>el.classList.remove('fire','ice','pop'));for(const p of d.cells)setCell(p);updateStats(d.stats)}else if(d.type==='paint'){for(const p of d.pixels)setCell(p,true);updateStats(d.stats)}else if(d.type==='generation'||d.type==='round'){cells.forEach(el=>el.classList.remove('fire','ice','pop'));for(let y=0;y<27;y++)for(let x=0;x<48;x++)if(d.grid[y][x])setCell({x:x+1,y:y+1,team:d.grid[y][x]});updateStats({generation:d.generation,territory:d.territory,latest:d.latest||[]})}if('round'in d)showRound(d.round)};ws.onclose=()=>setTimeout(connect,1200)}connect();
</script></body></html>
